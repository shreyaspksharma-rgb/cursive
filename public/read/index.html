<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta property="og:type" content="website"><meta property="og:url" content="https://cursivenews.com/read"><meta property="og:title" content="Cursive — read the photograph"><meta property="og:description" content="An interactive card. Find what hides in the frame, prove you read it."><meta property="og:image" content="https://cursivenews.com/read/share-card.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://cursivenews.com/read/share-card.png"><title>Cursive — travel piece (prototype)</title><style>html,body{margin:0;background:#e7e3da}body{padding:24px 14px;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style></head><body>
<style>
#cp{--card:#f3ece0;--ink:#23262d;--ink2:#867f72;--line:#2c333a;--bub:#fbf7ef;--field:#ffffff;--accent:#3c6b34;--hl:Georgia,'Times New Roman',serif}
#cp[data-theme="slate"]{--card:#191c22;--ink:#ece6d8;--ink2:#9a9486;--line:#e6d8bf;--bub:#232831;--field:#2b303a;--accent:#d7a13a;--hl:Georgia,'Times New Roman',serif}
#cp[data-theme="ink"]{--card:#ffffff;--ink:#1a1d24;--ink2:#7a8090;--line:#314099;--bub:#f3f6fc;--field:#ffffff;--accent:#314099;--hl:-apple-system,'Segoe UI',Roboto,sans-serif}
#cp{max-width:430px;margin:0 auto;color:#2b2b28;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#cp *{box-sizing:border-box}
#cp .ctrl{display:flex;align-items:center;gap:6px;margin:0 4px 11px;flex-wrap:wrap}
#cp .clab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#969389;margin-right:1px}
#cp .look,#cp .reset,#cp .cap{font:inherit;font-size:12.5px;padding:6px 13px;border:1px solid #d0ccc0;background:#f7f4ed;color:#4a4940;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
#cp .look:hover,#cp .reset:hover,#cp .cap:hover{border-color:#a9a397}
#cp .look.on{background:#2b2b28;border-color:#2b2b28;color:#f4f0e7}
#cp .cap{margin-left:auto}
#cp .cap.on{background:#3c6b34;border-color:#3c6b34;color:#f3f3ea}
#cp.cover-on .ctrl{display:none}
#cp .card{position:relative;background:var(--card);border-radius:24px;padding:16px 16px 18px;transition:background .3s ease}
#cp .top{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 11px}
#cp .mark{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:20px;color:var(--ink)}
#cp .prog{display:flex;gap:7px}
#cp .pdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink2);transition:background .25s,border-color .25s,transform .25s}
#cp .pdot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
#cp .prompt{margin:0 6px 11px;font-family:var(--hl);font-size:16px;color:var(--ink);min-height:22px}
#cp .prompt .small{font-style:normal;font-family:-apple-system,'Segoe UI',sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-right:8px}
#cp .prompt .ptxt{font-style:italic}
#cp .prompt.miss{animation:cpsh .32s}
#cp .prompt.miss .ptxt{color:#c0493f}
#cp .stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden}
#cp .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#cfc8ba}
#cp .ov{position:absolute;inset:0;width:100%;height:100%}
#cp .hint{fill:none;stroke:var(--line);stroke-width:2;opacity:0;stroke-dasharray:2 7;stroke-linecap:round;transition:opacity .25s}
#cp .region.active .hint{opacity:.45}
#cp .ink{fill:none;stroke:var(--line);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;transition:stroke-dashoffset .75s ease,opacity .2s}
#cp .region.solved .ink{stroke-dashoffset:0;opacity:1}
#cp .region.solved .hint{opacity:0}
#cp .halo{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .55s}
#cp .region.solved .halo{opacity:.14}
#cp .bghit{fill:transparent;cursor:pointer}
#cp .hit{fill:transparent;cursor:pointer}
#cp .bub{position:absolute;width:212px;max-width:74%;background:var(--bub);border-radius:18px;padding:11px 13px;opacity:0;transform:scale(.82);pointer-events:none;transition:opacity .16s ease,transform .16s ease;color:var(--ink);box-shadow:0 6px 22px rgba(20,20,20,.16);z-index:3}
#cp .bub.show{opacity:1;transform:scale(1);pointer-events:auto}
#cp .bub .tail{position:absolute;width:15px;height:15px;background:var(--bub);transform:rotate(45deg);border-radius:3px}
#cp .bub.tl .tail{top:-5px;left:22px}
#cp .bub.tr .tail{top:-5px;right:22px}
#cp .bub.b .tail{bottom:-5px;left:30px}
#cp .bub .q{font-size:14px;font-weight:500;line-height:1.35}
#cp .ans{display:flex;gap:7px;align-items:center;margin-top:10px}
#cp .ans input{flex:1;font:inherit;font-size:13px;padding:7px 12px;border:1px solid rgba(128,128,128,.32);background:var(--field);color:var(--ink);border-radius:999px;outline:none;min-width:0}
#cp .ans input:focus{border-color:var(--accent)}
#cp .ans .send{flex:none;width:30px;height:30px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
#cp .ans.bad input{border-color:#c0493f}
#cp .ans.shake{animation:cpsh .3s}
@keyframes cpsh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#cp .miss{font-size:11px;color:#c0493f;margin-top:5px;min-height:0}
#cp .head{min-height:24px;margin:14px 6px 0;font-family:var(--hl);font-size:17px;line-height:1.5;color:var(--ink)}
#cp.no-caption .head{display:none}
#cp .hw{opacity:0;transform:translateY(5px);display:inline;transition:opacity .35s ease,transform .35s ease}
#cp .hw.on{opacity:1;transform:none}
#cp .hw:not(:empty){margin-right:.3em}
#cp .meta{margin:8px 6px 0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
#cp .done{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:11px;opacity:0;pointer-events:none;transition:opacity .35s ease;line-height:1.4;padding:22px;z-index:4}
#cp .done.show{opacity:1;pointer-events:auto}
#cp .stamp{display:flex;align-items:center;gap:9px;font-family:var(--hl);font-size:23px;color:var(--ink)}
#cp .stampchk{width:30px;height:30px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center}
#cp .stampchk svg{width:16px;height:16px}
#cp .schk{stroke:var(--accent)}
#cp .dtext{font-size:13px;color:var(--ink2);max-width:250px}
#cp .cta{font:inherit;font-size:13.5px;font-weight:500;padding:10px 20px;border:none;background:var(--accent);color:#fff;border-radius:999px;cursor:pointer;margin-top:2px;transition:opacity .15s;text-decoration:none;display:inline-block}#cp .redir{font-size:11px;color:var(--ink2);margin-top:1px}
#cp .cta:hover{opacity:.9}
#cp .donebody{display:flex;flex-direction:column;align-items:center;gap:11px}
#cp .donebody.hide{display:none}
#cp .stub{display:none;flex-direction:column;align-items:center;gap:5px}
#cp .stub.show{display:flex}
#cp .stub .u{font-family:var(--hl);font-size:20px;color:var(--ink)}
#cp .stub .muted{font-size:12px;color:var(--ink2)}
#cp .reset2{font:inherit;font-size:12.5px;padding:7px 16px;border:1px solid rgba(128,128,128,.4);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;margin-top:8px}
#cp .cover{position:absolute;inset:0;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background:linear-gradient(to bottom, rgba(15,15,17,.30) 0%, rgba(15,15,17,.55) 55%, rgba(15,15,17,.84) 100%);z-index:6;transition:opacity .45s ease}
#cp:not(.cover-on) .cover{opacity:0;pointer-events:none}
#cp .cov-mark{position:absolute;top:16px;left:18px;font-family:Georgia,serif;font-style:italic;font-size:18px;color:#f3efe6}
#cp .cov-h{font-family:var(--hl);font-size:25px;line-height:1.16;color:#fff;max-width:80%}
#cp .cov-sub{font-size:13px;color:rgba(255,255,255,.82);margin-top:7px;max-width:76%;line-height:1.4}
#cp .logo{position:absolute;right:15px;bottom:14px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px}
#cp .logo svg{width:52px;height:52px;display:block;animation:cplogop 2.5s ease-in-out infinite}
@keyframes cplogop{0%,100%{opacity:.96;transform:scale(1)}50%{opacity:.72;transform:scale(1.06)}}
#cp .logo-hint{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.85)}
</style>

<script>
(function(){
  var root=document.getElementById('cp');
  if(!root)return;
  var bub=root.querySelector('.bub'), qEl=bub.querySelector('.q');
  var ansEl=bub.querySelector('.ans'), inp=bub.querySelector('input'), missEl=bub.querySelector('.miss');
  var done=root.querySelector('.done');
  var prompt=root.querySelector('.prompt'), ptxt=prompt.querySelector('.ptxt'), psmall=prompt.querySelector('.small');
  var data={
    face:{locate:'her face',q:'Her look, one word?',ok:['smil','happy','proud','calm','confiden','content','joy','warm','glad','pleas','grin'],rev:'try: smiling',word:'She smiles,',pos:{left:'29%',top:'30%',tail:'tl'}},
    suit:{locate:"what she's wearing",q:'Name it.',ok:['suit','spacesuit','space suit','flight','orange','jumpsuit','aces'],rev:'try: a suit',word:'zipped into orange,',pos:{left:'23%',top:'30%',tail:'b'}},
    ship:{locate:'what waits behind her',q:'Name it.',ok:['shuttle','spaceship','spacecraft','rocket','orbiter','ship','space'],rev:'try: the shuttle',word:'the shuttle waiting behind.',pos:{left:'24%',top:'35%',tail:'tr'}}
  };
  var order=['face','suit','ship'];
  var solved={face:false,suit:false,ship:false}, tries={face:0,suit:0,ship:0};
  var active=null, missT=null;
  function q(s){return root.querySelector(s);}
  function reg(z){return root.querySelector('.region[data-zone="'+z+'"]');}
  function curTarget(){for(var i=0;i<order.length;i++){if(!solved[order[i]])return order[i];}return null;}
  function updatePrompt(){var z=curTarget();if(!z){prompt.style.visibility='hidden';return;}prompt.style.visibility='';prompt.classList.remove('miss');psmall.textContent='Find';ptxt.textContent=data[z].locate;}
  function missSpot(){if(active)return;prompt.classList.remove('miss');void prompt.offsetWidth;prompt.classList.add('miss');ptxt.textContent='not there, read the picture';psmall.textContent='';clearTimeout(missT);missT=setTimeout(updatePrompt,950);}
  function setActive(z){order.forEach(function(k){reg(k).classList.toggle('active',k===z&&!solved[k]);});}
  function openQ(z){active=z;var p=data[z].pos;bub.style.left=p.left;bub.style.top=p.top;bub.className='bub '+p.tail;qEl.textContent=data[z].q;missEl.textContent='';inp.value='';ansEl.classList.remove('bad');bub.classList.add('show');setActive(z);setTimeout(function(){inp.focus();},70);}
  function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
  function check(){var z=active;if(!z)return;var v=norm(inp.value);if(!v)return;var hit=data[z].ok.some(function(k){return v.indexOf(k)>-1;});if(hit){solveZone(z);}else{tries[z]++;ansEl.classList.add('bad');ansEl.classList.remove('shake');void ansEl.offsetWidth;ansEl.classList.add('shake');missEl.textContent=tries[z]>=2?data[z].rev:'not quite, look again';}}
  function solveZone(z){solved[z]=true;reg(z).classList.remove('active');reg(z).classList.add('solved');q('.pdot[data-d="'+z+'"]').classList.add('on');var hw=q('.hw[data-word="'+z+'"]');hw.textContent=data[z].word;hw.classList.add('on');bub.classList.remove('show');active=null;updatePrompt();if(solved.face&&solved.suit&&solved.ship){setTimeout(function(){done.classList.add('show');if(window.self===window.top){setTimeout(function(){window.location.href='https://cursivenews.com';},2600);}},560);}}
  q('.bghit').addEventListener('click',function(e){e.stopPropagation();missSpot();});
  order.forEach(function(z){q('.hit[data-zone="'+z+'"]').addEventListener('click',function(e){e.stopPropagation();if(solved[z])return;if(z===curTarget()){openQ(z);}else{missSpot();}});});
  bub.querySelector('.send').addEventListener('click',function(e){e.stopPropagation();check();});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check();}});
  inp.addEventListener('input',function(){ansEl.classList.remove('bad');});
  bub.addEventListener('click',function(e){e.stopPropagation();});
  root.querySelector('.logo').addEventListener('click',function(){root.classList.remove('cover-on');});
  
  function reset(){solved={face:false,suit:false,ship:false};tries={face:0,suit:0,ship:0};active=null;order.forEach(function(z){reg(z).classList.remove('active','solved');q('.pdot[data-d="'+z+'"]').classList.remove('on');var hw=q('.hw[data-word="'+z+'"]');hw.classList.remove('on');hw.textContent='';});bub.classList.remove('show');ansEl.classList.remove('bad');missEl.textContent='';done.classList.remove('show');done.querySelector('.donebody').classList.remove('hide');done.querySelector('.stub').classList.remove('show');updatePrompt();}
  root.querySelector('.reset2').addEventListener('click',reset);
  updatePrompt();
})();
</script>
